[package]
name = "tvim"
version = "1.4.1"
edition = "2024"
rust-version = "1.85"
description = "A vim-like terminal text editor written in Rust."
authors = ["borhara"]
license = "MIT"
repository = "https://github.com/borhara/tvim"
keywords = ["editor", "vim", "terminal", "tui"]
categories = ["text-editors", "command-line-utilities"]

[dependencies]
tinsel = { version = "1.2", features = ["decode"] }
