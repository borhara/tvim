name: Release

# runs once CI has passed on main, so nothing is released from a red build
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  # Publishes to crates.io, tags and makes a GitHub release when Cargo.toml has a version
  # that isn't published yet, i.e. once a release PR is merged.
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      releases: ${{ steps.release-plz.outputs.releases }}
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Attaches prebuilt binaries to the new release. Called from here rather than on the tag,
  # because tags pushed with GITHUB_TOKEN don't trigger workflows.
  binaries:
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/binaries.yml
    with:
      tag: ${{ fromJSON(needs.release.outputs.releases)[0].tag }}
    secrets: inherit

  # Opens or updates a PR bumping the version and changelog from the commits since the last
  # release.
  release-pr:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr
      cancel-in-progress: false
    steps:
      # the branch, not the commit: release-pr needs a branch to open its PR against
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
