name: Binaries

# Builds tvim for each target and attaches the archives and install.sh to a release. Release
# calls this after publishing; run it by hand to backfill a tag.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: release tag, e.g. v1.0.0
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          # musl so the binaries are static and run on any distro
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Upload archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE: tvim-${{ matrix.target }}.tar.gz
        run: |
          cp target/${{ matrix.target }}/release/tvim .
          tar czf "$ARCHIVE" tvim LICENSE README.md
          gh release upload "${{ inputs.tag }}" "$ARCHIVE" --clobber --repo "$GITHUB_REPOSITORY"

  # attached from the current commit rather than the tag, so backfilled releases get it too
  installer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" install.sh --clobber --repo "$GITHUB_REPOSITORY"
