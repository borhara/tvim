# fmt, clippy and the tests, on the Rust in nixpkgs
when:
  - event: ["push", "pull_request"]
    branch: ["main"]

engine: microvm
image: nixos

dependencies:
  - cargo
  - rustc
  - rustfmt
  - clippy
  - gcc

environment:
  CARGO_TERM_COLOR: "always"
  RUSTFLAGS: "-D warnings"

steps:
  - name: fmt
    command: cargo fmt --check
  - name: clippy
    command: cargo clippy --all-targets
  - name: test
    command: cargo test --all-targets --no-fail-fast
